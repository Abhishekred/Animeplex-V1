name = "animeplex-logs"
main = "src/index.js"
compatibility_date = "2026-09-13"
workers_dev = true

# Dedicated fresh AnimePlex resources; preserve the older Zangetsu deployment.
[[kv_namespaces]]
binding = "LOGS"
id = "ad4ed8d0acf54a589327be2a46890e5c"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "animeplex-avatars"

[vars]
PROFILE_LOCK_API_BASE = "https://animeplex-sync.ttest.workers.dev"
AVATAR_PUBLIC_BASE = "https://pub-31b012ff212e4f15934133826c1d9570.r2.dev"
AVATAR_LEGACY_PUBLIC_BASE = "https://pub-31b012ff212e4f15934133826c1d9570.r2.dev"

# Optional: set DISCORD_WEBHOOK directly as a Worker secret to enable
# Discord notifications; logs are retained in LOGS even without it.
