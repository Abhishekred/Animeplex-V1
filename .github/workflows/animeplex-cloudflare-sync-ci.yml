name: AnimePlex Cloudflare Sync CI
on:
  push:
    branches: [test2]
    paths:
      - "cloudflare/animeplex-sync/**"
      - "cloudflare/log-intake/**"
      - ".github/workflows/animeplex-cloudflare-sync-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Worker API contracts
        run: node --test cloudflare/animeplex-sync/test/worker.test.mjs
      - name: Validate Cloudflare Worker syntax
        run: node --check cloudflare/animeplex-sync/src/index.mjs
      - name: Verify avatar intake supports the AnimePlex issuer
        run: node --test cloudflare/log-intake/avatar_slot.test.mjs
      - name: Check avatar intake Worker syntax
        run: node --check cloudflare/log-intake/src/index.js
      - name: Verify live Cloudflare staging health and fail-closed data access
        run: |
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          const root = 'https://animeplex-sync.ttest.workers.dev';
          async function probe(path) {
            for (let attempt = 0; attempt < 3; attempt++) {
              try { return await fetch(root + path, {signal: AbortSignal.timeout(12000)}); }
              catch(error) { if (attempt === 2) throw error; await new Promise(r => setTimeout(r, 3000)); }
            }
          }
          const health = await probe('/health');
          assert.equal(health.status, 200, 'staging /health should return HTTP 200');
          const status = await health.json();
          assert.equal(status.ok, true);
          assert.equal(status.backend, 'animeplex-supabase');
          assert.equal(status.services.data, true);
          assert.equal(status.services.rateLimit, true);
          assert.equal(status.services.klipy, true, 'KLIPY secret must be configured');
          console.log('Cloudflare staging health is live', status.services);
          const denied = await probe('/mylist');
          assert.equal(denied.status, 401, 'anonymous My List must not be accessible');
          const deniedHistory = await probe('/history');
          assert.equal(deniedHistory.status, 401, 'anonymous History must not be accessible');
          const deniedProfiles = await probe('/viewer_profiles');
          assert.equal(deniedProfiles.status, 401, 'anonymous Viewer Profiles must not be accessible');
          const deniedGifs = await probe('/klipy/v1/gifs/search?q=anime');
          assert.equal(deniedGifs.status, 401, 'anonymous GIF search must not be accessible');
          const badGif = await probe('/klipy/v1/gifs/search?q=x&q=y');
          assert.equal(badGif.status, 400, 'malformed GIF searches must be rejected');
          const unknown = await probe('/auth/v1/admin');
          assert.equal(unknown.status, 404, 'admin auth route must not be exposed');
          console.log('Anonymous My List, History, Profiles, GIFs blocked; malformed search rejected.');
          NODE
