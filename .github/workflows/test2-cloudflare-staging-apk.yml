name: AnimePlex Cloudflare Staging Unsigned APK

on:
  push:
    branches: [test2]
    paths:
      - ".github/workflows/test2-cloudflare-staging-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animeplex-cloudflare-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build separate unsigned Cloudflare staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZANGETSU_NO_DISCORD: "1"
      ZANGETSU_UNSIGNED_APK: "1"
      ZANGETSU_NIGHTLY: "1"
      STAGING_SYNC_URL: "https://animeplex-sync.ttest.workers.dev"

    steps:
      - name: Checkout test2 branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter and Pub cache
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
          pub-cache: true

      - name: Restore and save Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify staging-only Flutter environment
        shell: bash
        run: |
          set -euo pipefail
          cat > test/cloudflare_staging_ci_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:watch_app/core/environment.dart';
          void main() {
            test('Cloudflare staging uses its dedicated sync Worker', () {
              expect(Environment.vpsSyncUrl, 'https://animeplex-sync.ttest.workers.dev');
              expect(Environment.supabaseUrl, 'https://iwiujqjipotwvigvaaid.supabase.co');
            });
          }
          DART
          flutter test test/cloudflare_staging_ci_test.dart --dart-define="VPS_SYNC_URL=${STAGING_SYNC_URL}"
          rm test/cloudflare_staging_ci_test.dart

      - name: Set separate staging Android package and launcher label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          f = Path('android/app/build.gradle.kts')
          t = f.read_text()
          old = '        release {\n            // Do not use the default debug key for the manual-signing APK.'
          new = '        release {\n            applicationIdSuffix = ".staging"\n            // Do not use the default debug key for the manual-signing APK.'
          assert t.count(old) == 1, 'Release configuration changed: abort rather than risking production package overwrite'
          t = t.replace(old, new)
          old_label = 'if (isNightly) "AnimePlex Nightly" else "AnimePlex"'
          assert t.count(old_label) == 1, 'Expected app label not found'
          t = t.replace(old_label, 'if (isNightly) "AnimePlex Staging" else "AnimePlex"')
          f.write_text(t)
          PY

      - name: Prepare Android release build with Cloudflare URL
        run: flutter build apk --release --config-only --dart-define="VPS_SYNC_URL=${STAGING_SYNC_URL}"

      - name: Assemble unsigned release APK with encoded staging define
        shell: bash
        run: |
          set -euo pipefail
          define=$(printf 'VPS_SYNC_URL=%s' "${STAGING_SYNC_URL}" | base64 -w 0)
          cd android
          ./gradlew --no-daemon --build-cache "-Pdart-defines=${define}" :app:assembleRelease

      - name: Verify unsigned staging package and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find build/app/outputs android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit 2>/dev/null || true)
          if [[ -z "$apk" || ! -s "$apk" ]]; then
            echo "::error::Unsigned APK missing"
            exit 1
          fi
          unzip -tqq "$apk"
          signer="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if "$signer" verify "$apk"; then
            echo "::error::APK is signed, not unsigned"
            exit 1
          fi
          aapt="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" | grep -E "^package: name='com.animeplex_v1.staging'"
          mkdir -p dist
          cp "$apk" dist/AnimePlex-test2-Cloudflare-staging-unsigned.apk
          du -h dist/AnimePlex-test2-Cloudflare-staging-unsigned.apk

      - name: Upload separate unsigned staging APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlex-Cloudflare-staging-unsigned-${{ github.run_number }}
          path: dist/AnimePlex-test2-Cloudflare-staging-unsigned.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
