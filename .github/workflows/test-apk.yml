name: AnimePlex Test APK

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animeplex-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZANGETSU_NO_DISCORD: "1"
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
          pub-cache: true
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          unzip -tqq build/app/outputs/flutter-apk/app-debug.apk
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/AnimePlex-test-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlex-test-debug-${{ github.run_number }}
          path: dist/AnimePlex-test-debug.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
