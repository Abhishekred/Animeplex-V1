name: Remove superseded Supabase release branch

on:
  push:
    branches:
      - 'codex/animeplex-branding'

permissions:
  contents: write

jobs:
  delete-obsolete-release-ref:
    if: github.repository == 'Abhishekred/Animeplex-V1'
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged head and delete obsolete branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          expected='5eefe6587482aea9e6cc7ee52fb777d9d628f3b7'
          api="repos/$GITHUB_REPOSITORY/git/ref/heads/release/supabase-cloud-20261116"
          sha="$(gh api "$api" --jq '.object.sha')"
          if [[ "$sha" != "$expected" ]]; then
            echo 'Release branch changed since verification; aborting deletion.'
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/supabase-cloud-20261116"
          echo 'Obsolete release branch deleted after SHA verification.'
