name: AnimePlex Test2 Unsigned APK

on:
  push:
    branches:
      - test
      - test2
      - oldap
      - test2-upstream-integration-20261124
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animeplex-test2-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZANGETSU_NO_DISCORD: "1"
      ZANGETSU_UNSIGNED_APK: "1"
      APK_LABEL: ${{ github.ref_name == 'oldap' && 'oldap' || 'test2' }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter and Pub cache
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
          pub-cache: true

      - name: Restore and save Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Verify AnimePlex-only network routing
        run: |
          flutter test test/core/environment_test.dart test/core/share/pair_link_test.dart test/features/auth/auth_route_test.dart test/core/profiles/profile_picker_artwork_test.dart test/core/privacy/old_vps_isolation_test.dart test/core/admin/managed_provider_sync_test.dart test/core/admin/sources_access_permission_test.dart test/core/ui/nav_prefs_test.dart test/features/settings/settings_screen_test.dart

      - name: Test Home catalogue gestures
        run: flutter test test/features/home/source_catalogue_home_content_test.dart --plain-name 'CloudStream rows sharing a category stay interactive on Home'

      - name: Verify curated catalogue playback
        if: github.ref_name == 'oldap'
        run: flutter test test/core/repository/curated_catalogue_test.dart

      - name: Prepare Android release build
        run: flutter build apk --release --config-only

      # Gradle builds this directly because the Flutter APK copier assumes
      # a signed app-release.apk and cannot locate app-release-unsigned.apk.
      # This is the same approach verified by the earlier successful build.
      - name: Assemble unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --build-cache :app:assembleRelease

      - name: Verify and prepare unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find build/app/outputs android/app/build/outputs -type f -name '*release-unsigned.apk' -print -quit 2>/dev/null || true)
          if [[ -z "$apk" || ! -s "$apk" ]]; then
            echo "::error::Unsigned APK missing after Gradle assembleRelease."
            exit 1
          fi
          unzip -tqq "$apk"
          unzip -p "$apk" AndroidManifest.xml > /dev/null
          signer="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$signer" ]]; then
            echo "::error::Android apksigner not found."
            exit 1
          fi
          if "$signer" verify "$apk"; then
            echo "::error::APK is signed; refusing to upload as unsigned."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/AnimePlex-${APK_LABEL}-unsigned.apk"
          echo "Unsigned APK ready: $(du -h "dist/AnimePlex-${APK_LABEL}-unsigned.apk" | cut -f1)"

      - name: Upload unsigned APK only
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlex-${{ env.APK_LABEL }}-unsigned-${{ github.run_number }}
          path: dist/AnimePlex-${{ env.APK_LABEL }}-unsigned.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
