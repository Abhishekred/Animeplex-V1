name: Diagnose AnimePlex build
on:
  push:
    branches: ['codex/animeplex-branding']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Extract previous build errors
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/jobs/132073866974/logs" > "$RUNNER_TEMP/previous-build.log"
          python3 - "$RUNNER_TEMP/previous-build.log" <<'PY'
          import re, sys
          with open(sys.argv[1], errors='replace') as f:
              lines = f.readlines()
          pattern = re.compile(r'FAILURE:|BUILD FAILED|What went wrong|Execution failed|Caused by:|Could not |error:|Exception', re.I)
          hits = [i for i, line in enumerate(lines) if pattern.search(line)]
          chosen = set()
          for i in hits[-30:]:
              chosen.update(range(max(0, i - 2), min(len(lines), i + 8)))
          print('Previous build error excerpts:')
          print(''.join(lines[i] for i in sorted(chosen)[-200:])[-30000:])
          PY
