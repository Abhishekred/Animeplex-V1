name: AnimePlex unsigned APK

on:
  push:
    branches: [main, 'codex/**']
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

concurrency:
  group: animeplex-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZANGETSU_NO_DISCORD: "1"
      ANIMEPLEX_UNSIGNED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter and package cache
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check startup animation
        run: flutter test test/core/ui/splash_style_test.dart test/features/onboarding/animeplex_splash_test.dart

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          build_name=${version%+*}
          build_number=${version##*+}
          if [[ "$build_number" == "$version" ]]; then build_number=1; fi
          printf 'flutter.sdk=%s\nsdk.dir=%s\nflutter.versionName=%s\nflutter.versionCode=%s\n' \
            "$FLUTTER_ROOT" "$ANDROID_HOME" "$build_name" "$build_number" > android/local.properties
          cd android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK has no signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -tqq "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)
          test -x "$signer"
          if "$signer" verify --verbose "$apk" > signature-check.log 2>&1; then
            echo 'APK is signed; expected an unsigned APK.'
            exit 1
          fi
          if ! grep -q 'DOES NOT VERIFY' signature-check.log; then
            cat signature-check.log
            exit 1
          fi
          echo 'Unsigned APK verified.'

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimePlex-unsigned-apk
          path: build/app/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
